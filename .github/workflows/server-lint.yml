name: server-lint

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-lint.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
