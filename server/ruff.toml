# Ruff configuration
line-length = 120

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

# Ignore specific rules if needed
ignore = [
    "B008",  # Allow function calls in argument defaults (FastAPI Depends pattern)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"handlers/**/*.py" = ["E501"]  # SQL strings in handlers
"nycdb/**/*.py" = ["E501", "N", "UP", "B"]  # vendored loader; don't restyle it
